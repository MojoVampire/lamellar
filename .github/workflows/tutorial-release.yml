name: Publish tutorial images

on:
  push:
    tags: ['tutorial-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - slug: july2026-part1
            dir: tutorials/July_2026/part1_rust_basics
          - slug: july2026-part2
            dir: tutorials/July_2026/part2_lamellar_intro
          - slug: sept2026-part1
            dir: tutorials/Sept_2026/part1_rust_basics
          - slug: sept2026-part2
            dir: tutorials/Sept_2026/part2_lamellar_intro
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Compute image tag
        id: tag
        run: echo "value=${GITHUB_REF_NAME#tutorial-v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.dir }}
          push: true
          tags: |
            ghcr.io/pnnl/lamellar-tutorial:${{ matrix.slug }}-${{ steps.tag.outputs.value }}
            ghcr.io/pnnl/lamellar-tutorial:${{ matrix.slug }}-sha-${{ github.sha }}
          cache-from: type=gha,scope=tutorial-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=tutorial-${{ matrix.slug }}
